name: five_page_navigation
description: >-
  Snapchat-style navigation between a center page and four side pages with
  edge swipes, 14 built-in transitions, previews, haptics and a controller.
version: 3.0.0
repository: https://github.com/metekaganmusaak/five_page_navigation
issue_tracker: https://github.com/metekaganmusaak/five_page_navigation/issues
documentation: https://github.com/metekaganmusaak/five_page_navigation#readme

topics:
  - navigation
  - gestures
  - animation
  - transitions
  - swipe

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

screenshots:
  - description: Five Page Navigation logo
    path: assets/logo.png
